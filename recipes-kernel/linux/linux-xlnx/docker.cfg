# =========================
# Namespaces (Isolation)
# =========================
CONFIG_NAMESPACES=y              # Enable basic namespace support
CONFIG_UTS_NS=y                 # Isolate hostname/domain name
CONFIG_IPC_NS=y                 # Isolate System V IPC
CONFIG_PID_NS=y                 # Isolate process ID space
CONFIG_NET_NS=y                 # Isolate network stack
CONFIG_USER_NS=y                # Enable user namespace (required for modern containers)

# =========================
# Control Groups (Resource management)
# =========================
CONFIG_CGROUPS=y                # Enable cgroup framework
CONFIG_CGROUP_FREEZER=y         # Freeze/unfreeze tasks
CONFIG_CGROUP_DEVICE=y          # Control device access
CONFIG_CGROUP_CPUACCT=y         # Track CPU usage
CONFIG_CGROUP_PIDS=y            # Limit number of processes
CONFIG_CGROUP_SCHED=y           # CPU scheduling control

CONFIG_MEMCG=y                 # Memory resource controller
CONFIG_MEMCG_SWAP=y            # Allow swap accounting

# Core BPF support used by modern runtimes for cgroup/device policy hooks
CONFIG_BPF=y
# Expose the bpf() syscall so userspace runtimes such as runc can manage BPF hooks
CONFIG_BPF_SYSCALL=y
# Allow BPF programs to be attached to cgroups for device access filtering
CONFIG_CGROUP_BPF=y
CONFIG_CGROUP_MISC=y           # Misc cgroup controller (5.x feature)

# =========================
# Cgroup v2 (Recommended for Docker + systemd)
# =========================
CONFIG_CGROUP2_FS=y            # Enable unified cgroup v2 hierarchy

# =========================
# Filesystem (Container layers)
# =========================
CONFIG_OVERLAY_FS=y            # OverlayFS for Docker image layers

# =========================
# Networking (Container networking)
# =========================
CONFIG_VETH=y                 # Virtual Ethernet pair (container networking)
CONFIG_BRIDGE=y               # Linux bridge support
CONFIG_BRIDGE_NETFILTER=y     # Netfilter support for bridges

# Core packet filtering framework used by iptables/nftables backends
CONFIG_NETFILTER=y
# Docker's default bridge network relies on conntrack for NAT state tracking
CONFIG_NF_CONNTRACK=y
# Generic NAT engine required before IPv4 iptables NAT rules can work
CONFIG_NF_NAT=y

# Legacy iptables compatibility layer required by the iptables userspace tool
CONFIG_IP_NF_IPTABLES=y
# Enable the IPv4 "filter" table so iptables can manage FORWARD/INPUT rules
CONFIG_IP_NF_FILTER=y
# Enable the IPv4 "mangle" table used by some container network rule paths
CONFIG_IP_NF_MANGLE=y
# Enable the IPv4 "nat" table so Docker can create the DOCKER chain
CONFIG_IP_NF_NAT=y
# Provide MASQUERADE target for outbound traffic from bridge networks
CONFIG_IP_NF_TARGET_MASQUERADE=y

# Match the outgoing address type when Docker installs bridge/NAT rules
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
# Match connection tracking state in Docker-managed forwarding rules
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y

# =========================
# Security (Container isolation)
# =========================
CONFIG_SECCOMP=y              # Secure computing mode
CONFIG_SECCOMP_FILTER=y       # Filter syscalls (required by Docker)
CONFIG_KEYS=y                 # Kernel key management (used by containers)

# =========================
# General kernel features (Required by container runtime)
# =========================
CONFIG_FHANDLE=y              # File handle support (used by container tools)
CONFIG_EVENTFD=y              # Event notification mechanism
CONFIG_SIGNALFD=y             # Signal handling via file descriptors
CONFIG_TIMERFD=y              # Timer events via file descriptors
CONFIG_EPOLL=y                # Efficient I/O event notification

# =========================
# Optional but recommended
# =========================
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y  # Separate /dev/pts per container
CONFIG_POSIX_MQUEUE=y               # POSIX message queues
